overview: "Automatically detects and manages media segments (intros, outros, recaps, previews)"
description: >
  Recognizes and manages media segments using chapter name matching, black frame detection, chromaprint audio fingerprinting, and EDL import. Supports hardware-accelerated decoding, silence/chapter/keyframe boundary refinement, and incremental processing.

